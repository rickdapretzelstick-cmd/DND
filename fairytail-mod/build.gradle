plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // optional in-game autotest, e.g.  ./gradlew runClient -PftTest=aquarius -PftShots=8,40,62
            ['ftTest': 'fairytail.autotest', 'ftShots': 'fairytail.shots', 'ftCamera': 'fairytail.camera', 'ftRepeat': 'fairytail.repeat', 'ftNoFx': 'fairytail.nofx', 'ftLeft': 'fairytail.left'].each { prop, sys ->
                if (project.hasProperty(prop)) systemProperty sys, project.property(prop)
            }
            if (project.hasProperty('ftConnect')) programArguments.addAll(['--quickPlayMultiplayer', project.property('ftConnect')])
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version      : neo_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
