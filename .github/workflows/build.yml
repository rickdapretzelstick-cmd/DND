name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build Windows app
        run: tools/build.sh 0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: DnD-Campaign-Runner-windows
          path: dist/*.exe
